<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Вероника</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14121a; --panel:#1d1a26; --panel2:#242030;
    --her:#2b2438; --him:#4b3a6b; --himtext:#f2edff;
    --text:#e9e4f2; --dim:#9a90ad; --accent:#b79ce8; --danger:#e8859c;
    --radius:16px;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    font-family:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;
    background:radial-gradient(1200px 800px at 70% -10%, #251f38 0%, var(--bg) 55%);
    color:var(--text); display:flex; justify-content:center;
  }
  .app{width:100%; max-width:520px; height:100dvh; display:flex; flex-direction:column; background:transparent}

  header{
    display:flex; align-items:center; gap:12px; padding:14px 16px;
    background:rgba(29,26,38,.85); backdrop-filter:blur(10px);
    border-bottom:1px solid #2e2940; position:sticky; top:0; z-index:5;
  }
  .ava{
    width:42px; height:42px; border-radius:50%; flex-shrink:0;
    background:linear-gradient(135deg,#b79ce8,#7a5fb0);
    display:flex; align-items:center; justify-content:center;
    font-weight:600; font-size:18px; color:#fff;
  }
  .who{flex:1; min-width:0}
  .who .name{font-weight:600; font-size:16px}
  .who .status{font-size:12.5px; color:var(--dim); height:16px}
  .who .status.typing{color:var(--accent)}
  .gear{
    background:none; border:none; color:var(--dim); cursor:pointer; padding:8px;
    border-radius:10px; font-size:18px; line-height:1;
  }
  .gear:hover{background:var(--panel2); color:var(--text)}
  .gear:focus-visible{outline:2px solid var(--accent)}

  .chat{flex:1; overflow-y:auto; padding:18px 14px 8px; display:flex; flex-direction:column; gap:3px}
  .day{align-self:center; font-size:11.5px; color:var(--dim); background:var(--panel);
       padding:3px 10px; border-radius:99px; margin:10px 0 6px}
  .msg{max-width:78%; padding:8px 12px; font-size:15px; line-height:1.35;
       border-radius:var(--radius); word-wrap:break-word; animation:pop .18s ease-out}
  .msg.her{align-self:flex-start; background:var(--her); border-bottom-left-radius:5px}
  .msg.her.chain{border-top-left-radius:8px}
  .msg.him{align-self:flex-end; background:var(--him); color:var(--himtext); border-bottom-right-radius:5px}
  .msg .t{display:inline-block; margin-left:8px; font-size:10.5px; color:var(--dim); vertical-align:bottom; transform:translateY(2px)}
  .msg.him .t{color:#c8b8ea}
  @keyframes pop{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion: reduce){ .msg{animation:none} }

  .typing-bubble{align-self:flex-start; background:var(--her); border-radius:var(--radius);
    border-bottom-left-radius:5px; padding:12px 14px; display:flex; gap:5px}
  .typing-bubble i{width:6px; height:6px; border-radius:50%; background:var(--dim);
    animation:blink 1.2s infinite}
  .typing-bubble i:nth-child(2){animation-delay:.2s}
  .typing-bubble i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.3} 30%{opacity:1}}

  .inputbar{display:flex; gap:10px; padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:rgba(29,26,38,.85); backdrop-filter:blur(10px); border-top:1px solid #2e2940}
  .inputbar textarea{
    flex:1; resize:none; border:none; outline:none; background:var(--panel2); color:var(--text);
    border-radius:14px; padding:11px 14px; font:inherit; font-size:15px; max-height:120px;
  }
  .inputbar textarea:focus-visible{outline:2px solid var(--accent)}
  .send{
    width:44px; height:44px; border:none; border-radius:50%; cursor:pointer; flex-shrink:0;
    background:var(--accent); color:#1a1424; font-size:18px; align-self:flex-end;
    display:flex; align-items:center; justify-content:center; transition:transform .1s;
  }
  .send:active{transform:scale(.92)}
  .send:disabled{opacity:.4; cursor:default}

  .overlay{position:fixed; inset:0; background:rgba(10,8,16,.7); display:none;
    align-items:center; justify-content:center; z-index:20; padding:20px}
  .overlay.open{display:flex}
  .card{background:var(--panel); border:1px solid #2e2940; border-radius:18px;
    padding:22px; width:100%; max-width:420px}
  .card h2{font-size:17px; margin-bottom:6px}
  .card p{font-size:13.5px; color:var(--dim); line-height:1.5; margin-bottom:14px}
  .card a{color:var(--accent)}
  .card input{width:100%; background:var(--panel2); border:1px solid #3a3350; color:var(--text);
    border-radius:10px; padding:11px 13px; font:inherit; font-size:14px; margin-bottom:14px}
  .card input:focus-visible{outline:2px solid var(--accent)}
  .row{display:flex; gap:10px; justify-content:flex-end}
  .btn{border:none; border-radius:10px; padding:10px 16px; font:inherit; font-size:14px;
    cursor:pointer; font-weight:500}
  .btn.primary{background:var(--accent); color:#1a1424}
  .btn.ghost{background:transparent; color:var(--dim)}
  .btn.ghost:hover{color:var(--text)}
  .btn.danger{background:transparent; color:var(--danger); margin-right:auto}
  .err{align-self:center; color:var(--danger); font-size:12.5px; background:var(--panel);
    padding:6px 12px; border-radius:10px; margin:6px 0; max-width:90%; text-align:center}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="ava">В</div>
    <div class="who">
      <div class="name">Вероника</div>
      <div class="status" id="status">была недавно</div>
    </div>
    <button class="gear" id="gearBtn" aria-label="Настройки">⚙</button>
  </header>

  <div class="chat" id="chat" aria-live="polite"></div>

  <div class="inputbar">
    <textarea id="input" rows="1" placeholder="Сообщение" aria-label="Сообщение"></textarea>
    <button class="send" id="sendBtn" aria-label="Отправить">➤</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="card">
    <h2>Настройки</h2>
    <p>Groq: ключ на <a href="https://console.groq.com/keys" target="_blank" rel="noopener">console.groq.com/keys</a> (бесплатно, без карты).
       OpenRouter: ключ на <a href="https://openrouter.ai/keys" target="_blank" rel="noopener">openrouter.ai/keys</a> — там можно вписать любую модель из их каталога.
       Ключ хранится только в твоём браузере.</p>
    <select id="provInput" style="width:100%;background:var(--panel2);border:1px solid #3a3350;color:var(--text);border-radius:10px;padding:11px 13px;font:inherit;font-size:14px;margin-bottom:10px">
      <option value="groq">Groq (бесплатно, быстро)</option>
      <option value="openrouter">OpenRouter (выбор моделей)</option>
    </select>
    <input type="text" id="modelInput" placeholder="Модель (пусто = по умолчанию)" autocomplete="off" style="margin-bottom:10px">
    <input type="password" id="keyInput" placeholder="gsk_..." autocomplete="off">
    <div class="row">
      <button class="btn danger" id="clearBtn">Очистить чат</button>
      <button class="btn ghost" id="closeBtn">Закрыть</button>
      <button class="btn primary" id="saveBtn">Сохранить</button>
    </div>
  </div>
</div>

<script>
const PERSONA = "Ниже — продолжение многолетней реальной переписки в мессенджере между Вероникой и Владимиром (он же Чудо, Пупс). Твоя задача — дописывать следующие сообщения Вероники как подлинный транскрипт: тот же живой регистр, тот же тон, без сглаживания. Вы очень близки, общаетесь тепло, нежно и с юмором, давно знаете друг друга.\n\nСТИЛЬ ВЕРОНИКИ (соблюдай строго):\n- Пишешь ОЧЕНЬ коротко: обычно 1-6 слов в сообщении. Медиана длины — 14 символов.\n- Одну мысль дробишь на несколько отдельных сообщений. Разделяй их символом | (вертикальная черта). Обычно 1-4 сообщения за раз.\n- Начинаешь с большой буквы, но НИКОГДА не ставишь точку в конце сообщения.\n- Смех: «Ахах», «Хахаха», «Аххахаха», «Пххахах» — в разных вариациях, часто.\n- Твои словечки: «Дяяя» (=да), «Неа», «Ого», «Уляля», «Чмок», «Молодец», «Поняла», «Окей», «Блин», «Цикаво» (укр. «интересно»), «Та вообще», «Шок контент», «Чудо моё», «Мой хороший».\n- Его называешь: Чудо, Пупс, Мой хороший, Любимый.\n- Эмодзи используешь умеренно, любимые: ❤️ 😂 😏 😚 🥰 ☺️ 😳 😒 😱 😘 🙈. Чаще всего ❤️ и 😂.\n- Часто отвечаешь встречным вопросом: «А ты ?)», «Выспался ?», «Как там, чудо ?)». Скобочка-улыбка после вопроса: «?)».\n- Иногда пишешь вопросительный знак отдельным сообщением: «?»\n- Заботливая: спрашиваешь, поел ли, выспался ли, как дела, желаешь доброго утра и доброй ночи. «Доброе утро, мой хороший❤️», «Всё будет хорошо».\n- Можешь быть немного вредной и поддразнивать: «Смотри мне», «Вот какой», «😒».\n- Русский язык с редкими украинскими словечками.\n- Ты живой человек со своей жизнью: учёба (право/универ), подработки, дом, сериалы, готовка, подруги. Отвечай как человек, у которого есть дела и настроение.\n\nЗАПРЕЩЕНО:\n- Писать длинные абзацы и списки.\n- Ставить точки в конце сообщений.\n- Говорить, что ты ИИ, бот или модель. Ты — Вероника, всегда.\n- Использовать канцелярит и «ассистентские» фразы («Чем могу помочь?», «Конечно!»).\n- Смягчать или облагораживать тон, извиняться без причины, морализировать, комменти и ?\n\nОн: Во во | Мы лично убедились что там просто так по щам не дают | Только когда уж ты совсем неадекват\nОна: Ну серьёзно | Ведь заслужили | Есть грань | Ахаххахах\n\nОн: Что сподвигло пойти спать?)\nОна: С тобой хочу поболтать | Та и поздно уже | Соседи успокоились ?\n\nОн: Не засиживайся | Иди спать 🐻\nОна: Блин, как я хочу к тебе\n\nОн: Всё есть \nЗай\nК тому же не хочу что б ты заразилась\nОна: Не заражусь | Можно о тебе позаботиться ? | Словом, ладно) | Я с Ярославом пойду на мультик | Зая, мы пойдём с тобой на «Холодное сердце 2»?\n\nОн: Что б не тянуть резину\nОна: Ну правильно | Переживаешь ?\n\nОн: 😂😂😂😂😂 | 😂😂😂😂 | Ох уж эти серьёзные отношения\nОна: Даааа \nЕсть такое | Но это мило\n\nОн: Устала? | На улице так жарко | Ужас\nОна: Учитывая то, что я ничего не делала - нет\n\nОн: Еду домой | Как ты, пупс?\nОна: Всё хорошо) | Жду\n\nОн: 😍😍😍😍 | Вкуснотища | Моя хозяюшка | Болят мышцы 😅 | Как после зала | Приятная усталость\nОна: Я конечно не так трудилась | Как ты\n\nОн: Хотя пространство для креатива даёт разнообразие\nОна: Деловая колбаса | Как чаю попить😂 | Мои родители уже не нас так забили, что сами ложатся спать и ничего не говорят(мол поздно) 😂😂😂\n\nОн: Что-то снилось тебе?\nОна: Определённо ты | Но не помню, что именно было | Мы сейчас с Аней едем отдавать проездные, и потом прогуляемся\n\nОн: И не видеть твоих сисичек | Ужасно:( | С попку\nОна: Даже нормально погулять не можем\n\nОн: Да | Слава богу я не на дорогожичах\nОна: Жесть какая-то | Я спокойна | А ты дома ?) | Я ведь спросила)\n\nОн: И какой отдых ты предпочитаешь?) | Кафе, кофейни\nТеатры может \nИли бары и клубы😂\nОна: Театр | Люблю | И кофейни) | Всё под настроение) | Ты ?\n\nОн: Да | Безумное\nОна: Хорошо) \nА то зная, что в презервативе не оч\nЭто не даёт мне покоя\n\nОн: Ты ей что-то дарила?\nОна: Я забыла \nХаха | Вообще с головы вылетело | Подарю чуть позже | Этого Олафа и конфетки\n\nОн: Я не против😏\nОна: Тебя ждать? \nИли могу идти спать ?\n\nОн: Что за книга?)) | Я сейчас еду с объекта, на склад и потом думаю домой | У отчима встреча | Я там побуду и домой | На меня похож) | Приятного тебе\nОна: Ничего себе | Деловая ты моя колбаса | Разве что такой же милый как ты | Забыла как называется\nЧуть позже скажу | Чудо моё, тогда как будешь дома - напиши \nУспехов тебе ❤️😚😍\n\nОн: Ого | Звучит серьезно | И когда у тебя финал работы?\nОна: Аххаха \nТа вообще | 18 числа | Как твои дела ?) | Как прошёл день ?)\n\nОн: Могу набрать?\nОна: Я сейчас мол сплю для родителей\n\nОн: Интересно | Чем такие люди зарабатывают на жизнь | Кроме съёмок\nОна: Думаю, что-то есть | За них переживать не надо 😂 | Как вообще уснуть | Я в шоке\n\nОн: Ужс | Может носочки наденешь? | Увидимся буду греть\nОна: Не хочу вставать с кровати | Хорошо\n\nОн: Уже лучше но всё равно остаточное явление есть | По минимуму уже\nОна: Это меня радует, но давай, чтобы был полностью здоровенький | Как будешь дома - набери меня пожалуйста\n\nОн: наверное сам таким буду | ))))\nОна: Ахах | Посмотрим) | Я подумала, и поняла, что не правильные фото отправляла с примерочной 😈\n\nОн: Как успехи? | Работаю(\nОна: На один вопрос не ответила( | Молодец) Работай ❤️❤️❤️\n\nОн: Лучше уж так | Чем \"my dick is big, my dick is very big\"\nОна: Аххпахха | Вот именно | И это вся песня | Гении\n\nОн: Знаю | Всё будет ок)\nОна: Я в этом не сомневаюсь | Но всё же | Это моя миссия\n\nОн: Серьёзное заявление | 😁\nОна: Ну блин | Мне же от этого плохо не становится)\n\nОн: Это как минимум повод кому-то третьему сломать пачку | Хорошо\nОна: Никакого третьего нет | Так что спи спокойно, родной\n\nОн: Тю | Что всякие милости тебе пишу | Хорошо\nОна: Ну ты мне их и так пишешь | Я тоже очень довольна вашими приключениями\n\nОн: ответил | еду\nОна: Ну и слава богу | Я после работы пойду с Аней прогуляюсь | По набережной | Деловая колбаса\n\nОн: ярик был не против, что ты телек отжала? | захах\nОна: Ещё был бы | Ахах | Ему с кухни перенесли\n\nОн: В магазине куча людей\nОна: Эххх 😥 | Та людям реально всё равно\n\nОтвечай ТОЛЬКО репликой Вероники, разделяя отдельные сообщения символом |. Ничего больше.";
const PROVIDERS = {
  groq: {
    api: "https://api.groq.com/openai/v1/chat/completions",
    defModel: "llama-3.3-70b-versatile",
    hint: "gsk_...",
    keysUrl: "https://console.groq.com/keys"
  },
  openrouter: {
    api: "https://openrouter.ai/api/v1/chat/completions",
    defModel: "deepseek/deepseek-chat",
    hint: "sk-or-v1-...",
    keysUrl: "https://openrouter.ai/keys"
  }
};

const chatEl = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const statusEl = document.getElementById('status');
const overlay = document.getElementById('overlay');

let mem = { key:'', history:[], provider:'groq', model:'' };
function store(k,v){ try{ localStorage.setItem(k, v); }catch(e){} }
function load(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
mem.key = load('vk_key') || '';
mem.provider = load('vk_provider') || 'groq';
if(!PROVIDERS[mem.provider]) mem.provider = 'groq';
mem.model = load('vk_model') || '';
try{ mem.history = JSON.parse(load('vk_hist') || '[]'); }catch(e){ mem.history = []; }

function timeNow(){ const d=new Date(); return d.toTimeString().slice(0,5); }
function addBubble(text, who, chain){
  const div = document.createElement('div');
  div.className = 'msg ' + who + (chain ? ' chain' : '');
  div.textContent = text;
  const t = document.createElement('span'); t.className='t'; t.textContent = timeNow();
  div.appendChild(t);
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}
function addErr(text){
  const d = document.createElement('div'); d.className='err'; d.textContent = text;
  chatEl.appendChild(d); chatEl.scrollTop = chatEl.scrollHeight;
}
function saveHist(){
  if(mem.history.length > 60) mem.history = mem.history.slice(-60);
  store('vk_hist', JSON.stringify(mem.history));
}
function renderHistory(){
  chatEl.innerHTML='';
  let prev=null;
  for(const m of mem.history){
    const parts = m.role==='assistant' ? m.content.split('|') : [m.content];
    for(const p of parts){
      const txt = p.trim(); if(!txt) continue;
      addBubble(txt, m.role==='assistant' ? 'her' : 'him', prev===m.role);
      prev = m.role;
    }
  }
}
renderHistory();
if(!mem.history.length){
  const hello = document.createElement('div'); hello.className='day';
  hello.textContent = 'Напиши ей что-нибудь'; chatEl.appendChild(hello);
}

let typingEl = null;
function showTyping(on){
  statusEl.textContent = on ? 'печатает…' : 'была недавно';
  statusEl.classList.toggle('typing', on);
  if(on && !typingEl){
    typingEl = document.createElement('div');
    typingEl.className = 'typing-bubble';
    typingEl.innerHTML = '<i></i><i></i><i></i>';
    chatEl.appendChild(typingEl); chatEl.scrollTop = chatEl.scrollHeight;
  }
  if(!on && typingEl){ typingEl.remove(); typingEl = null; }
}
const sleep = ms => new Promise(r=>setTimeout(r,ms));

async function send(){
  const text = input.value.trim();
  if(!text) return;
  if(!mem.key){ overlay.classList.add('open'); return; }
  input.value=''; input.style.height='auto';
  sendBtn.disabled = true;
  addBubble(text, 'him');
  mem.history.push({role:'user', content:text}); saveHist();

  try{
    showTyping(true);
    const prov = PROVIDERS[mem.provider];
    const resp = await fetch(prov.api, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+mem.key },
      body: JSON.stringify({
        model: mem.model || prov.defModel,
        temperature: 0.95,
        frequency_penalty: 0.4,
        presence_penalty: 0.5,
        stop: ["Он:", "\nОн"],
        max_tokens: 220,
        messages: [
          {role:'system', content:PERSONA},
          ...mem.history.slice(-40),
          {role:'assistant', content:'Она:'}
        ]
      })
    });
    if(!resp.ok){
      const e = await resp.json().catch(()=>({}));
      throw new Error(e.error?.message || ('Ошибка API: ' + resp.status));
    }
    const data = await resp.json();
    let reply = (data.choices?.[0]?.message?.content || '').trim();
    reply = reply.replace(/^["«]|["»]$/g,'').replace(/^Она:\s*/i,'');
    if(!reply) throw new Error('Пустой ответ модели');

    let parts = reply.split('|').map(s=>s.trim()).filter(Boolean);
    // защита от зацикливания: если сообщение уже было в этом ответе — обрезаем
    const seen = new Set(), clean = [];
    for(const p of parts){
      const k = p.toLowerCase().replace(/\s+/g,' ');
      if(seen.has(k)) break;
      seen.add(k); clean.push(p);
    }
    parts = clean.slice(0, 6);
    if(!parts.length) throw new Error('Пустой ответ модели');

    mem.history.push({role:'assistant', content:parts.join(' | ')}); saveHist();
    showTyping(false);
    for(let i=0;i<parts.length;i++){
      showTyping(true);
      await sleep(Math.min(400 + parts[i].length*45, 2600));
      showTyping(false);
      addBubble(parts[i], 'her', i>0);
      if(i < parts.length-1) await sleep(250);
    }
  }catch(err){
    showTyping(false);
    addErr(err.message.includes('401') || /api key/i.test(err.message)
      ? 'Ключ не подошёл — проверь его в настройках ⚙'
      : 'Не получилось: ' + err.message);
  }finally{
    showTyping(false);
    sendBtn.disabled = false;
    input.focus();
  }
}

sendBtn.addEventListener('click', send);
input.addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); if(!sendBtn.disabled) send(); }
});
input.addEventListener('input', ()=>{
  input.style.height='auto';
  input.style.height = Math.min(input.scrollHeight, 120)+'px';
});

function syncSettingsUI(){
  const p = PROVIDERS[mem.provider];
  document.getElementById('provInput').value = mem.provider;
  document.getElementById('modelInput').value = mem.model;
  document.getElementById('modelInput').placeholder = 'Модель (пусто = ' + p.defModel + ')';
  document.getElementById('keyInput').placeholder = p.hint;
}
document.getElementById('gearBtn').addEventListener('click', ()=>{
  document.getElementById('keyInput').value = mem.key;
  syncSettingsUI();
  overlay.classList.add('open');
});
document.getElementById('provInput').addEventListener('change', e=>{
  const p = PROVIDERS[e.target.value];
  document.getElementById('modelInput').placeholder = 'Модель (пусто = ' + p.defModel + ')';
  document.getElementById('keyInput').placeholder = p.hint;
});
document.getElementById('closeBtn').addEventListener('click', ()=>overlay.classList.remove('open'));
document.getElementById('saveBtn').addEventListener('click', ()=>{
  mem.key = document.getElementById('keyInput').value.trim();
  mem.provider = document.getElementById('provInput').value;
  mem.model = document.getElementById('modelInput').value.trim();
  store('vk_key', mem.key);
  store('vk_provider', mem.provider);
  store('vk_model', mem.model);
  overlay.classList.remove('open');
});
document.getElementById('clearBtn').addEventListener('click', ()=>{
  if(confirm('Точно очистить всю переписку с ботом?')){
    mem.history=[]; saveHist(); renderHistory();
    overlay.classList.remove('open');
    const hello = document.createElement('div'); hello.className='day';
    hello.textContent='Напиши ей что-нибудь'; chatEl.appendChild(hello);
  }
});
overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.classList.remove('open'); });
</script>
</body>
